<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Scrobblint favicon — neo-brutalist equalizer bars, echoing the navbar brand mark.
       Ink border, hard offset shadow (no blur), rounded tile, accent bars. -->
  <!-- hard offset shadow -->
  <rect x="4" y="4" width="26" height="26" rx="6" fill="#111014"/>
  <!-- tile -->
  <rect x="2" y="2" width="26" height="26" rx="6" fill="#8b8cff" stroke="#111014" stroke-width="2"/>
  <!-- equalizer bars (lime / yellow / coral, matching .bar-chart accents) -->
  <g stroke="#111014" stroke-width="1.5">
    <rect x="6.5"  y="14" width="4.5" height="10" rx="1.2" fill="#c6f36d"/>
    <rect x="12.75" y="7" width="4.5" height="17" rx="1.2" fill="#ffd54f"/>
    <rect x="19"   y="11" width="4.5" height="13" rx="1.2" fill="#ff8e7a"/>
  </g>
</svg>
